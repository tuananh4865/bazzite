name: Build Bazzite Deck 43.20260420 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - iso-43-20260420
      - main

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Mount Container Storage BTRFS Loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout Repo at 43.20260420
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: c310fc1a1127f707b8723d46fb8f0c48915d0583
          submodules: recursive

      - name: Patch titanoboa_hook_postrootfs.sh to use local /src/branding
        run: |
          sed -i 's|git clone --depth 1 --quiet https://github.com/ublue-os/bazzite.git /root/packages|mkdir -p /root/packages/installer \&\& cp -r /src/branding /root/packages/installer/branding|g' installer/titanoboa_hook_postrootfs.sh
          grep -n -C 5 "branding" installer/titanoboa_hook_postrootfs.sh

      - name: Build Container Image (bazzite-deck:stable-43.20260420)
        run: |
          BASE_IMAGE="ghcr.io/ublue-os/bazzite:stable-43.20260420"
          INSTALL_IMAGE_PAYLOAD="ghcr.io/ublue-os/bazzite-deck:stable-43.20260420"
          FLATPAK_DIR_SHORTNAME="kde_flatpaks"

          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$INSTALL_IMAGE_PAYLOAD" \
            --build-arg FLATPAK_DIR_SHORTNAME="$FLATPAK_DIR_SHORTNAME" \
            -t localhost/payload:latest installer/

      - name: Show disk space
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img

      - name: Build Live ISO via Titanoboa
        uses: Zeglius/titanoboa@revamp-pr
        id: build
        with:
          image-ref: localhost/payload:latest
          iso-dest: bazzite-deck-stable-43.20260420-live-amd64.iso

      - name: Prepare Upload Directory and Checksum
        id: upload-directory
        shell: bash
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          ISO_PATH=${{ steps.build.outputs.iso-dest }}
          ISO_NAME=$(basename "${ISO_PATH}")

          mkdir -p "${ISO_UPLOAD_DIR}"
          mv "${ISO_PATH}" "${ISO_UPLOAD_DIR}/"
          (cd "${ISO_UPLOAD_DIR}" && sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM")
          ls -lh "${ISO_UPLOAD_DIR}"
          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to GitHub Actions Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bazzite-deck-stable-43.20260420-live-amd64-iso
          path: ${{ steps.upload-directory.outputs.iso-upload-dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Split and Publish to GitHub Release (Direct Download Backup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ steps.upload-directory.outputs.iso-upload-dir }}"
          split -b 1900M -d bazzite-deck-stable-43.20260420-live-amd64.iso bazzite-deck-stable-43.20260420-live-amd64.iso.part-
          gh release create iso-43.20260420 \
            --title "Bazzite Deck (ROG Ally) Live ISO - stable-43.20260420" \
            --notes "Custom built Live ISO from official container ghcr.io/ublue-os/bazzite-deck:stable-43.20260420" \
            bazzite-deck-stable-43.20260420-live-amd64.iso-CHECKSUM \
            bazzite-deck-stable-43.20260420-live-amd64.iso.part-* || true
